[project]
name = "websearch-mcp"
version = "0.1.0"
description = "零 API Key 的多引擎聚合联网搜索 MCP：真并发扇出 + 熔断降级 + 双级缓存 + 结果融合 + 正文提取"
requires-python = ">=3.10"
dependencies = [
    # 与目标机（vivo Ubuntu 24.04）上 shared-memory-mcp 已验证的版本保持一致，
    # 避免「在我机器上能跑」的问题
    "fastmcp==4.1.0",
    "uvicorn==0.54.0",
    "starlette==1.7.0",
    "httpx>=0.27,<1",
    # SOCKS 代理支持（httpx 的 socks5:// 代理必需）。2026-10-15 实测：
    # 容器 venv 漏装它 → 普通代理直测路径 9/9 ImportError（socks 节点
    # 全被判死），且报错只显示在探测日志里、上层看成「节点都差」。
    # 漏装症状：httpx.AsyncClient(proxy="socks5://...") 抛 ImportError。
    "socksio>=1.0.0",
]

[project.optional-dependencies]
# 正文提取增强：有 trafilatura 时优先用它（准确率显著更高），
# 没装则自动降级到内置启发式提取器。装不装都能跑。
extract = ["trafilatura>=1.12"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.scripts]
websearch-mcp = "websearch.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 联网测试默认跳过（CI / 离线环境），需要时： pytest -m online
markers = [
    "online: 需要真实网络的端到端测试",
]
addopts = "-m 'not online'"
